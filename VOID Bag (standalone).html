    const blobUrls = {};

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    }

    console.error('Bundle unpack error:', err);

t-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7c6ee47d-d8ad-4144-a8d7-33738b21b2d2\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f1b5e5af-b639-43aa-b747-dfffd5f132e2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5765e2fc-74f1-429d-81ff-668b44834666\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ════ grumb shared shop styles ════ */\n:root{\n  --paper:#f4f1ec; --ink:#0a0a0a; --bone:#e8e4db;\n  --rust:#c94c1a; --rust2:#e85d2a; --mute:#8a857c;\n  --line:rgba(10,10,10,.14); --line-d:rgba(244,241,236,.14);\n}\n*,*::before,*::after{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nhtml{scroll-behavior:smooth}\nbody{font-family:'Space Mono',ui-monospace,Menlo,monospace;font-size:13px;line-height:1.55;background:var(--paper);color:var(--ink);overflow-x:hidden;cursor:none}\na{color:inherit;text-decoration:none}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:none}\ninput,select,textarea{font:inherit;cursor:none}\n::selection{background:var(--rust);color:var(--paper)}\n\n#cosmos{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;opacity:.35}\n.cur-dot,.cur-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;border-radius:999px;transform:translate(-50%,-50%)}\n.cur-dot{width:12px;height:12px;background:var(--rust)}\n.cur-ring{width:40px;height:40px;border:1px solid var(--ink);transition:width .25s,height .25s,border-color .2s,background .2s}\n.cur-ring.is-dark{border-color:var(--paper)}\n.cur-ring.is-hot{width:64px;height:64px;background:rgba(201,76,26,.08);border-color:var(--rust)}\n\n.wrap{position:relative;z-index:1}\n.eyebrow{font:11px/1 'Space Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}\n.eyebrow.dark{color:#9c968a}\n.display{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.005em;line-height:.86}\n.serif-i{font-family:'DM Serif Display',serif;font-style:italic}\n.reveal{opacity:0;transform:translateY(40px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1)}\n.reveal.in{opacity:1;transform:translateY(0)}\n.d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}.d4{transition-delay:.4s}\n\n/* NAV */\n.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 28px;background:rgba(244,241,236,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:box-shadow .35s,border-color .35s;border-bottom:1px solid transparent}\n.nav.scrolled{box-shadow:0 12px 40px -22px rgba(10,10,10,.35);border-bottom-color:var(--line)}\n.nav .brand{display:flex;align-items:baseline;gap:12px;font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.04em}\n.nav .brand small{font:10px/1 'Space Mono',monospace;letter-spacing:.22em;color:var(--mute);padding-left:14px;border-left:1px solid var(--line);text-transform:uppercase}\n.nav ul{display:flex;gap:38px;list-style:none;padding:0;margin:0;justify-self:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase}\n.nav ul a{position:relative;padding:6px 0;display:inline-block}\n.nav ul a::after{content:\"\";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--ink);transition:width .4s cubic-bezier(.16,1,.3,1)}\n.nav ul a:hover::after,.nav ul a.on::after{width:100%}\n.nav ul a.on{color:var(--rust)} .nav ul a.on::after{background:var(--rust)}\n.nav .right{display:flex;align-items:center;gap:18px;justify-self:end;font-size:11px;letter-spacing:.22em;text-transform:uppercase}\n.nav .right .ccy{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:999px}\n.nav .right .ccy .dot{width:6px;height:6px;border-radius:99px;background:var(--rust)}\n.nav .right .acct{display:inline-flex;align-items:center;gap:8px}\n.nav .right .acct .av{width:26px;height:26px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;font-family:'Bebas Neue';font-size:15px;line-height:1}\n.cart{position:relative;padding:10px 18px;border:1px solid var(--ink);border-radius:999px;overflow:hidden;isolation:isolate;will-change:transform}\n.cart::before{content:\"\";position:absolute;inset:0;background:var(--ink);transform:translateX(-101%);transition:transform .5s cubic-bezier(.16,1,.3,1);z-index:-1}\n.cart:hover{color:var(--paper)} .cart:hover::before{transform:translateX(0)}\n.cart .n{margin-left:10px;padding-left:10px;border-left:1px solid currentColor;opacity:.85}\n.cart.bump{animation:bump .45s cubic-bezier(.16,1,.3,1)}\n@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}\n\n.btn{position:relative;padding:16px 26px;border:1px solid var(--ink);border-radius:999px;font:11px/1 'Space Mono',monospace;letter-spacing:.22em;text-transform:uppercase;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;gap:14px;color:var(--ink);will-change:transform}\n.btn::before{content:\"\";position:absolute;inset:0;background:var(--ink);transform:translateX(-101%);transition:transform .55s cubic-bezier(.65,0,.35,1);z-index:-1}\n.btn:hover{color:var(--paper)} .btn:hover::before{transform:translateX(0)}\n.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)} .btn.primary::before{background:var(--rust)}\n.btn.dark{border-color:var(--paper);color:var(--paper)} .btn.dark::before{background:var(--paper)} .btn.dark:hover{color:var(--ink)}\n.btn.full{width:100%;justify-content:center}\n.btn.lg{height:60px;padding:0 32px}\n.btn .arr{width:22px;height:1px;background:currentColor;position:relative}\n.btn .arr::after{content:\"\";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}\n\n/* crumbs */\n.crumbs{padding:90px 40px 24px;display:flex;justify-content:space-between;font:11px/1 'Space Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}\n.crumbs a:hover{color:var(--rust)}\n.crumbs .b{display:flex;gap:10px;align-items:center}\n\n/* page title */\n.ptitle{padding:8px 40px 36px}\n.ptitle h1{margin:0 0 0 -8px;font-family:'Bebas Neue',sans-serif;font-size:200px;line-height:.84;letter-spacing:0}\n.ptitle h1 em{font-family:'DM Serif Display',serif;font-style:italic;color:var(--rust);font-size:.5em;letter-spacing:-.01em}\n.ptitle .sub{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:20px;margin-top:24px;color:var(--mute);font:11px/1.5 'Space Mono';letter-spacing:.18em;text-transform:uppercase}\n\n/* steps bar */\n.steps{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;font:11px/1 'Space Mono';letter-spacing:.18em;text-transform:uppercase}\n.steps a,.steps span{flex:1;text-align:center;padding:14px 12px;color:var(--mute);position:relative;transition:background .3s,color .3s}\n.steps .on{background:var(--ink);color:var(--paper)}\n.steps .done2{color:var(--rust)}\n\n/* form fields */\n.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}\n.field label{font:10px/1 'Space Mono';letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}\n.field input,.field select{height:52px;border:1px solid var(--line);background:transparent;padding:0 16px;font:13px/1 'Space Mono';color:var(--ink);transition:border-color .25s}\n.field input:focus,.field select:focus{outline:0;border-color:var(--ink)}\n.field.err input{border-color:var(--rust)}\n.field .hint{font:10px/1.3 'Space Mono';color:var(--mute)}\n.field .hint.bad{color:var(--rust)}\n.frow{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n.frow.three{grid-template-columns:1fr 1fr 1fr}\n\n/* footer */\n.ft{background:var(--paper);padding:80px 40px 32px;border-top:1px solid var(--line)}\n.ft-top{display:grid;grid-template-columns:1.4fr 2fr;gap:60px;padding-bottom:60px;border-bottom:1px solid var(--line)}\n.ft-brand .display{font-size:160px;line-height:.86;display:inline-block;transition:letter-spacing .8s cubic-bezier(.16,1,.3,1),color .3s}\n.ft-brand:hover .display{letter-spacing:.04em;color:var(--rust)}\n.ft-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}\n.ft-cols > div{display:flex;flex-direction:column;gap:10px;font:12px/1.8 'Space Mono';color:#3a3833}\n.ft-cols b{font-weight:400;font:11px/1 'Space Mono';letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}\n.ft-cols a:hover{color:var(--rust)}\n.ft-bot{display:flex;justify-content:space-between;align-items:center;padding-top:22px;font:11px/1 'Space Mono';letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}\n\n/* toast */\n.toast{position:fixed;top:90px;right:28px;z-index:60;background:var(--ink);color:var(--paper);padding:18px 22px;display:flex;gap:16px;align-items:center;transform:translateX(150%);transition:transform .5s cubic-bezier(.16,1,.3,1);max-width:340px;border-left:2px solid var(--rust)}\n.toast.show{transform:translateX(0)}\n.toast .tx{font:11px/1.5 'Space Mono';letter-spacing:.06em}\n.toast .tx b{font-family:'Bebas Neue';font-size:20px;letter-spacing:.02em;display:block;text-transform:uppercase}\n.toast .tx small{color:rgba(244,241,236,.6);text-transform:uppercase;letter-spacing:.18em;font-size:9px}\n\n/* generic garment thumb */\n.gthumb{position:relative;overflow:hidden;background:#191919}\n.gthumb .gm{position:absolute;inset:0;display:grid;place-items:center}\n.gthumb .gm svg{width:64%;max-width:160px;filter:drop-shadow(0 12px 20px rgba(0,0,0,.4))}\n.gthumb::after{content:\"\";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 12px,transparent 12px 24px);mix-blend-mode:overlay;pointer-events:none}\n\n/* marquee */\n.marquee{background:var(--paper);color:var(--ink);overflow:hidden;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:22px 0;position:relative;z-index:1}\n.marquee .track{display:flex;gap:48px;width:max-content;animation:slide 24s linear infinite;align-items:center}\n.marquee .track span{font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:.02em;white-space:nowrap;line-height:1;display:inline-flex;align-items:center;gap:48px}\n.marquee .track span::after{content:\"✦\";color:var(--rust);font-family:'DM Serif Display',serif;font-style:italic;font-size:32px}\n.marquee:hover .track{animation-duration:60s}\n@keyframes slide{to{transform:translateX(-50%)}}\n\n/* ════ RESPONSIVE — shared chrome ════ */\n@media (max-width:860px){\n  /* touch: no custom cursor */\n  body{cursor:auto}\n  .cur-dot,.cur-ring{display:none}\n  a,button,input,select,textarea,.cart,.btn{cursor:pointer}\n\n  .nav{grid-template-columns:1fr auto;padding:12px 16px;gap:12px}\n  .nav ul{display:none}\n  .nav .brand{font-size:26px;gap:8px}\n  .nav .brand small{display:none}\n  .nav .right{gap:10px}\n  .nav .right .ccy{display:none}\n  .cart{padding:9px 14px;font-size:10px}\n\n  .crumbs{padding:78px 16px 16px;font-size:10px;flex-wrap:wrap;gap:8px}\n  .ptitle{padding:6px 16px 28px}\n  .ptitle h1{font-size:clamp(64px,22vw,120px);margin-left:-2px}\n  .ptitle .sub{flex-direction:column;align-items:flex-start;gap:8px;font-size:10px}\n\n  .btn{padding:14px 20px;font-size:10px;gap:10px}\n  .btn.lg{height:54px}\n\n  .frow,.frow.three{grid-template-columns:1fr}\n\n  .ft{padding:56px 16px 28px}\n  .ft-top{grid-template-columns:1fr;gap:32px;padding-bottom:36px}\n  .ft-brand .display{font-size:96px}\n  .ft-cols{grid-template-columns:1fr 1fr;gap:26px}\n  .ft-bot{flex-direction:column;gap:8px;align-items:flex-start;font-size:10px}\n\n  .marquee{padding:18px 0}\n  .marquee .track span{font-size:48px;gap:32px}\n  .marquee .track{gap:32px}\n\n  .toast{top:auto;bottom:18px;right:12px;left:12px;max-width:none}\n  .steps{font-size:9px}\n  .steps a,.steps span{padding:12px 6px;letter-spacing:.1em}\n}\n@media (max-width:480px){\n  .ft-cols{grid-template-columns:1fr}\n  .marquee .track span{font-size:38px}\n}\n<\u002Fstyle>\n<style>\n  .bagWrap{display:grid;grid-template-columns:1.5fr .85fr;gap:0;border-top:1px solid var(--line);min-height:70vh}\n  .bagMain{padding:36px 48px 80px;border-right:1px solid var(--line)}\n  .bagMain .topline{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:20px;border-bottom:1px solid var(--line)}\n  .bagMain .topline h2{font-family:'Bebas Neue';font-size:38px;line-height:.9}\n  .bagMain .topline .cnt{font:11px/1 'Space Mono';letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}\n\n  .line{display:grid;grid-template-columns:130px 1fr auto;gap:28px;padding:30px 0;border-bottom:1px solid var(--line);position:relative}\n  .line .thumb{aspect-ratio:3/4;width:130px;border-radius:2px}\n  .line .thumb .gm svg{max-width:110px}\n  .line .mid{display:flex;flex-direction:column;gap:6px}\n  .line .mid .cat{font:10px/1 'Space Mono';letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}\n  .line .mid .nm{font-family:'Bebas Neue';font-size:40px;line-height:.92;margin-top:4px}\n  .line .mid .sub{font:12px/1.4 'Space Mono';color:#3a3833}\n  .line .mid .attrs{display:flex;gap:18px;margin-top em><\u002Fh3><\u002Fdiv><a class=\"btn\" data-hot=\"\" href=\"VOID.html#collections\">View all 24 →<\u002Fa><\u002Fdiv>\n  <div class=\"xgrid\" id=\"xgrid\"><\u002Fdiv>\n<\u002Fsection>\n\n<footer class=\"ft\">\n  <div class=\"ft-top\">\n    <div class=\"ft-brand\"><a href=\"VOID.html\"><div class=\"display\">grumb<\u002Fdiv><\u002Fa><div class=\"eyebrow\" style=\"margin-top:14px\">— infinite style. eternal chic.<\u002Fdiv><\u002Fdiv>\n    <div class=\"ft-cols\">\n      <div><b>Shop<\u002Fb><a href=\"Product.html?p=parka\">Outerwear<\u002Fa><a href=\"Product.html?p=suit\">Tailoring<\u002Fa><a href=\"Product.html?p=knit\">Knit<\u002Fa><a href=\"Collections.html\">Archive<\u002Fa><\u002Fdiv>\n      <div><b>Account<\u002Fb><a href=\"Account.html\">Overview<\u002Fa><a href=\"Track.html\">Track order<\u002Fa><a href=\"Bag.html\">Bag<\u002Fa><a href=\"Account.html\">Register<\u002Fa><\u002Fdiv>\n      <div><b>Service<\u002Fb><a href=\"VOID.html#about\">Shipping<\u002Fa><a href=\"VOID.html#about\">Returns<\u002Fa><a href=\"VOID.html#about\">Care<\u002Fa><a href=\"VOID.html#stockists\">Contact<\u002Fa><\u002Fdiv>\n      <div><b>Legal<\u002Fb><a href=\"VOID.html#about\">Privacy<\u002Fa><a href=\"VOID.html#about\">Terms<\u002Fa><a href=\"VOID.html#about\">Imprint<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ft-bot\"><span>© grumb 2024 — All wrongs reserved.<\u002Fspan><span>Tokyo ↔ Paris<\u002Fspan><span>Site by grumb Studio<\u002Fspan><\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n\n<div class=\"toast\" id=\"toast\"><div class=\"tx\"><b id=\"toastNm\">Updated<\u002Fb><small id=\"toastMeta\"><\u002Fsmall><\u002Fdiv><\u002Fdiv>\n\n<script src=\"92314079-7061-41fa-a7f6-d08d261f7755\"><\u002Fscript>\n<script>\nseedCartIfEmpty();\nconst G=window.VOID_G, BG=window.VOID_BG, CAT=window.VOID_CAT;\nconst FREE_SHIP=20000, TAX_RATE=0.10;\nlet discount=0, discountLabel='';\n\nconst linesEl=document.getElementById('lines');\nconst toast=document.getElementById('toast');\nfunction showToast(nm,meta){document.getElementById('toastNm').textContent=nm;document.getElementById('toastMeta').textContent=meta||'';\n  toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),2400);}\n\nfunction lineHTML(l,i){\n  const bg=BG[l.slug]||['#1a1a1a','rgba(244,241,236,.9)'];\n  return `<div class=\"line\" data-i=\"${i}\">\n    <a class=\"thumb gthumb\" href=\"Product.html?p=${l.slug}\" style=\"background:${bg[0]}\"><div class=\"gm\" style=\"color:${bg[1]}\">${G[l.slug]||''}<\u002Fdiv><\u002Fa>\n    <div class=\"mid\">\n      <span class=\"cat\">${l.cat||''} · N°${(CAT[l.slug]||{}).num||''}<\u002Fspan>\n      <a class=\"nm\" href=\"Product.html?p=${l.slug}\">${l.nm}<\u002Fa>\n      <span class=\"sub\">${l.sub||''}<\u002Fspan>\n      <div class=\"attrs\"><span>Size <b>${l.size}<\u002Fb><\u002Fspan><span>Color <b>${l.color}<\u002Fb><\u002Fspan><\u002Fdiv>\n      <div class=\"acts\"><button data-act=\"save\" data-i=\"${i}\">Save for later<\u002Fbutton><button data-act=\"remove\" data-i=\"${i}\">Remove<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"right\">\n      <div class=\"pr\">${yen(l.price*l.qty)}<small>${yen(l.price)} each<\u002Fsmall><\u002Fdiv>\n      <div class=\"qty\">\n        <button data-act=\"dec\" data-i=\"${i}\" aria-label=\"decrease\">–<\u002Fbutton>\n        <span class=\"v\">${l.qty}<\u002Fspan>\n        <button data-act=\"inc\" data-i=\"${i}\" aria-label=\"increase\">+<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction render(){\n  const cart=readCart();\n  const empty=document.getElementById('empty');\n  if(cart.length===0){\n    linesEl.innerHTML='';\n    empty.style.display='block';\n    document.getElementById('perks').style.display='none';\n    document.getElementById('emptyGm').innerHTML=G.coat;\n    document.getElementById('checkoutBtn').style.opacity=.4;\n    document.getElementById('checkoutBtn').style.pointerEvents='none';\n  }else{\n    empty.style.display='none';\n    document.getElementById('perks').style.display='flex';\n    document.getElementById('checkoutBtn').style.opacity=1;\n    document.getElementById('checkoutBtn').style.pointerEvents='auto';\n    linesEl.innerHTML=cart.map(lineHTML).join('');\n  }\n  const q=cartQty();\n  document.getElementById('itemCnt').textContent=q+(q===1?' piece':' pieces');\n  document.querySelectorAll('[data-cartcount]').forEach(el=>el.textContent=String(q).padStart(2,'0'));\n  updateSummary();\n}\n\nfunction updateSummary(){\n  const sub=cartSubtotal();\n  const ship = sub>=FREE_SHIP||sub===0 ? 0 : 1200;\n  const tax = Math.round(sub*TAX_RATE/(1+TAX_RATE)); // tax-incl display\n  const disc = Math.round(sub*discount);\n  const total = Math.max(0, sub - disc + ship);\n  document.getElementById('sSubtotal').textContent=yen(sub);\n  document.getElementById('sShip').innerHTML = sub===0? '—' : (ship===0?'<span class=\"free\">Free<\u002Fspan>':yen(ship));\n  document.getElementById('sTax').textContent=yen(tax);\n  document.getElementById('sTotal').textContent=yen(total);\n  const dr=document.getElementById('sDiscRow');\n  if(disc>0){dr.style.display='flex';document.getElementById('sDisc').textContent='−'+yen(disc);}else{dr.style.display='none';}\n  // free-ship progress\n  const remain=Math.max(0,FREE_SHIP-sub);\n  const fill=Math.min(100, sub/FREE_SHIP*100);\n  document.getElementById('shipFill').style.width=fill+'%';\n  document.getElementById('shipText').textContent = sub===0 ? 'Add items to unlock free shipping'\n    : remain>0 ? 'Add '+yen(remain)+' more for free shipping' : 'You’ve unlocked free express shipping ✦';\n}\n\nlinesEl.addEventListener('click',e=>{\n  const b=e.target.closest('button[data-act]'); if(!b)return;\n  const i=+b.dataset.i, act=b.dataset.act, cart=readCart();\n  if(act==='inc'){cart[i].qty++;}\n  else if(act==='dec'){cart[i].qty--; if(cart[i].qty<1)cart[i].qty=1;}\n  else if(act==='remove'||act==='save'){\n    const row=b.closest('.line'); row.classList.add('removing');\n    const nm=cart[i].nm; cart.splice(i,1); writeCart(cart);\n    showToast(act==='save'?'Saved for later':'Removed', nm);\n    setTimeout(render,380); return;\n  }\n  writeCart(cart); render();\n});\n\n/* promo */\nconst codes={ 'VOID10':[.10,'Register −10% applied'], 'KEEP15':[.15,'Member −15% applied'], 'SS24':[.05,'Season −5% applied'] };\ndocument.getElementById('promoBtn').addEventListener('click',applyPromo);\ndocument.getElementById('promo').addEventListener('keydown',e=>{if(e.key==='Enter')applyPromo()});\nfunction applyPromo(){\n  const v=document.getElementById('promo').value.trim().toUpperCase();\n  const msg=document.getElementById('promoMsg');\n  if(codes[v]){discount=codes[v][0];discountLabel=codes[v][1];msg.style.color='var(--rust)';msg.textContent=codes[v][1];\n    localStorage.setItem('void_promo',JSON.stringify({code:v,rate:discount}));updateSummary();}\n  else{discount=0;msg.style.color='var(--rust)';msg.textContent=v?'Code not recognised':'';updateSummary();}\n}\n// restore promo\ntry{const p=JSON.parse(localStorage.getItem('void_promo'));if(p){discount=p.rate;document.getElementById('promo').value=p.code;document.getElementById('promoMsg').textContent='Code '+p.code+' applied';}}catch(e){}\n\n/* marquee */\ndocument.getElementById('mTrack').innerHTML=['YOUR BAG','KEPT NOT WORN','SS 2024','FREE RETURNS','grumb COLLECTIVE','YOUR BAG','KEPT NOT WORN','SS 2024','FREE RETURNS','grumb COLLECTIVE'].map(w=>`<span>${w}<\u002Fspan>`).join('');\n\n/* cross-sell — items not already in bag */\nfunction renderXsell(){\n  const inBag=new Set(readCart().map(l=>l.slug));\n  const pool=Object.keys(CAT).filter(s=>!inBag.has(s)).slice(0,4);\n  const xs=pool.length?pool:Object.keys(CAT).slice(0,4);\n  document.getElementById('xgrid').innerHTML=xs.map(s=>{const it=CAT[s],bg=BG[s];\n    return `<a class=\"xcard\" data-hot href=\"Product.html?p=${s}\">\n      <div class=\"gthumb\" style=\"background:${bg[0]}\"><div class=\"gm\" style=\"color:${bg[1]}\">${G[s]}<\u002Fdiv><div class=\"add\">+ View piece<\u002Fdiv><\u002Fdiv>\n      <div class=\"info\"><div class=\"nm\">${it.nm}<small>${it.sub}<\u002Fsmall><\u002Fdiv><div class=\"pr\">${yen(it.price)}<\u002Fdiv><\u002Fdiv>\n    <\u002Fa>`;}).join('');\n}\n\nrender(); renderXsell();\nVOID.initChrome();\n<\u002Fscript>\n\n<script>/*__GRUMB_NINJA__*/(function grumbNinja(){\n  if (window.__grumbNinja) return; window.__grumbNinja = true;\n  var REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  var THEMES = [\n    {k:'soke',   nm:'Sōke',   el:'Rust · default', rust:'#c8440e', rust2:'#e85a24', paper:'#f4f1ec', ink:'#0a0a0a'},\n    {k:'katon',  nm:'Katon',  el:'Fire',      rust:'#e0432a', rust2:'#ff6a3d', paper:'#f4efe9', ink:'#0c0908'},\n    {k:'suiton', nm:'Suiton', el:'Water',     rust:'#2f86a6', rust2:'#46a9c4', paper:'#edf0f1', ink:'#080c0e'},\n    {k:'futon',  nm:'Fūton',  el:'Wind',      rust:'#4f9e7a', rust2:'#6fc299', paper:'#eef1ed', ink:'#090c0a'},\n    {k:'raiton', nm:'Raiton', el:'Lightning', rust:'#c39a32', rust2:'#e8c25c', paper:'#f3efe5', ink:'#0c0b07'},\n    {k:'kage',   nm:'Kage',   el:'Shadow',    rust:'#7a6488', rust2:'#9a82ab', paper:'#eceaef', ink:'#0a0a0c'}\n  ];\n  function findT(k){ for(var i=0;i<THEMES.length;i++){ if(THEMES[i].k===k) return THEMES[i]; } return THEMES[0]; }\n\n  // compact ninja mascot markup (120-unit coordinate system, scaled by container)\n  function ninjaHTML(){\n    return '<div class=\"gn-stage\"><div class=\"gn-inner\">'+\n      '<div class=\"gn-tail left\"><\u002Fdiv><div class=\"gn-tail right\"><\u002Fdiv>'+\n      '<div class=\"gn-mask\"><\u002Fdiv><div class=\"gn-head\"><\u002Fdiv>'+\n      '<div class=\"gn-band\"><div class=\"gn-eyes\"><div class=\"gn-eye left\"><\u002Fdiv><div class=\"gn-eye right\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>'+\n    '<\u002Fdiv><\u002Fdiv>';\n  }\n\n  function apply(k, animate){\n    var t = findT(k);\n    var r = document.documentElement.style;\n    r.setProperty('--rust', t.rust); r.setProperty('--rust2', t.rust2);\n    r.setProperty('--paper', t.paper); r.setProperty('--ink', t.ink);\n    try{ localStorage.setItem('grumb_theme', k); }catch(e){}\n    var opts = document.querySelectorAll('.gn-opt');\n    for (var i=0;i<opts.length;i++){ opts[i].classList.toggle('on', opts[i].getAttribute('data-k')===k); }\n    if (animate){ var st = document.querySelector('.gn-ninja .gn-inner'); if(st){ st.classList.remove('gn-poof'); void st.offsetWidth; st.classList.add('gn-poof'); var b=document.querySelector('.gn-ninja'); if(b) burstSmoke(b.querySelector('.gn-stage'), 12, 60, 56); } }\n  }\n\n  var saved = 'soke'; try{ saved = localStorage.getItem('grumb_theme') || 'soke'; }catch(e){}\n  apply(saved, false);\n\n  var css = document.createElement('style');\n  css.textContent = `\n    /* ===== ninja mascot (120-unit, scaled) ===== */\n    .gn-ninja{position:relative;display:inline-block;vertical-align:middle;width:46px;height:44px;margin-left:10px;background:none;border:0;padding:0;flex:0 0 auto}\n    .gn-ninja .gn-stage{position:absolute;top:50%;left:50%;width:120px;height:120px;transform:translate(-50%,-50%) scale(.34);transform-origin:center;overflow:visible}\n    .gn-inner{position:absolute;inset:0;transform-origin:center bottom;animation:gnFloat 3.2s ease-in-out infinite}\n    .gn-inner.gn-poof{animation:gnFloat 3.2s ease-in-out infinite, gnPoof .6s cubic-bezier(.34,1.56,.64,1)}\n    @keyframes gnFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}\n    @keyframes gnPoof{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}\n    .gn-head{position:absolute;top:14px;left:10px;width:100px;height:92px;background:var(--ink,#0a0a0a);border-radius:22px 22px 16px 16px;box-shadow:inset -6px -8px 0 rgba(0,0,0,.35)}\n    .gn-head::before{content:'';position:absolute;top:8px;left:14px;width:40px;height:10px;background:#1a1a18;border-radius:8px;opacity:.6}\n    .gn-band{position:absolute;top:46px;left:6px;width:108px;height:26px;background:var(--rust,#c8440e);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);z-index:3}\n    .gn-eyes{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:22px}\n    .gn-eye{width:22px;height:9px;background:var(--paper,#f4f1ec);border-radius:3px;transform:skewX(-8deg);transition:height .15s ease,transform .15s ease}\n    .gn-eye.right{transform:skewX(8deg)}\n    .gn-tail{position:absolute;top:50px;width:42px;height:20px;background:var(--rust,#c8440e);z-index:2}\n    .gn-tail.left{left:-30px;transform-origin:right center;clip-path:polygon(0 30%,100% 0,100% 100%,0 70%);animation:gnTailL 2s ease-in-out infinite}\n    .gn-tail.right{right:-30px;transform-origin:left center;clip-path:polygon(0 0,100% 30%,100% 70%,0 100%);animation:gnTailR 2.3s ease-in-out infinite}\n    @keyframes gnTailL{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(-30deg) translateX(-3px)}}\n    @keyframes gnTailR{0%,100%{transform:rotate(15deg)}50%{transform:rotate(30deg) translateX(3px)}}\n    .gn-mask{position:absolute;top:72px;left:14px;width:92px;height:34px;background:var(--ink,#0a0a0a);border-radius:0 0 16px 16px;z-index:1;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3)}\n    .gn-eye{animation:gnBlink 4s steps(1) infinite}\n    @keyframes gnBlink{0%,52%,57%,100%{opacity:1}54%{opacity:.12}}\n    /* hover squint */\n    .gn-ninja:hover .gn-inner{animation-play-state:paused;transform:translateY(-3px)}\n    .gn-ninja:hover .gn-eye{height:4px}\n    .gn-ninja:hover .gn-eye.left{transform:skewX(-18deg)}\n    .gn-ninja:hover .gn-eye.right{transform:skewX(18deg)}\n    .gn-ninja:hover .gn-tail.left{animation:none;transform:rotate(-42deg)}\n    .gn-ninja:hover .gn-tail.right{animation:none;transform:rotate(42deg)}\n    .gn-reduce .gn-inner,.gn-reduce .gn-tail,.gn-reduce .gn-eye{animation:none!important}\n    .gn-smoke{position:absolute;border-radius:50%;background:#2a2a28;pointer-events:none;z-index:5}\n    /* ===== theme popover ===== */\n    .gn-pop{position:fixed;top:58px;left:14px;z-index:99990;width:256px;background:#0a0a0a;color:#f4f1ec;border-top:2px solid var(--rust);padding:16px 16px 10px;transform:translateY(-10px);opacity:0;pointer-events:none;transition:opacity .3s cubic-bezier(.16,1,.3,1),transform .3s cubic-bezier(.16,1,.3,1);box-shadow:0 30px 70px -24px rgba(0,0,0,.7)}\n    .gn-pop.open{opacity:1;transform:none;pointer-events:auto}\n    .gn-pop .gn-h{font:10px/1.4 'Space Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:#8a857c;margin-bottom:12px}\n    .gn-opt{display:flex;align-items:center;gap:13px;padding:9px 8px;background:none;border:0;color:#f4f1ec;text-align:left;width:100%;cursor:pointer;transition:background .2s}\n    .gn-opt:hover,.gn-opt.on{background:rgba(244,241,236,.06)}\n    .gn-chip{width:26px;height:18px;flex:0 0 auto;border-radius:4px;position:relative;display:flex;align-items:center;justify-content:center;gap:4px}\n    .gn-chip i{width:5px;height:3px;background:#f4f1ec;border-radius:1px;transform:skewX(-8deg)}\n    .gn-nm{font-family:'Bebas Neue',sans-serif;font-size:19px;line-height:1;letter-spacing:.04em;display:flex;flex-direction:column;gap:3px}\n    .gn-nm small{font:9px/1 'Space Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#8a857c}\n    .gn-opt.on .gn-nm small{color:var(--rust)}\n    /* ===== intro ===== */\n    #gnIntro{position:fixed;inset:0;z-index:100000;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}\n    #gnIntro .gn-bigninja{position:relative;width:150px;height:150px;margin-bottom:24px;opacity:0;transform:scale(.6)}\n    #gnIntro.play .gn-bigninja{transition:opacity .5s,transform .55s cubic-bezier(.34,1.56,.64,1);opacity:1;transform:scale(1)}\n    #gnIntro .gn-bigninja .gn-stage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.18);transform-origin:center}\n    #gnIntro .gn-iword{display:flex;align-items:flex-end;overflow:hidden;padding:0 .08em .14em;font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(78px,13vw,168px);line-height:.9;letter-spacing:.03em;color:#f4f1ec}\n    #gnIntro .gn-iword span,#gnIntro .gn-iword b{display:inline-block;transform:translateY(120%)}\n    #gnIntro .gn-iword b{color:var(--rust);font-weight:400}\n    #gnIntro.play .gn-iword span,#gnIntro.play .gn-iword b{animation:gnRise .9s cubic-bezier(.16,1,.3,1) forwards}\n    #gnIntro.play .gn-iword span:nth-child(1){animation-delay:.55s}\n    #gnIntro.play .gn-iword span:nth-child(2){animation-delay:.62s}\n    #gnIntro.play .gn-iword span:nth-child(3){animation-delay:.69s}\n    #gnIntro.play .gn-iword span:nth-child(4){animation-delay:.76s}\n    #gnIntro.play .gn-iword span:nth-child(5){animation-delay:.83s}\n    #gnIntro.play .gn-iword b{animation-delay:.91s}\n    #gnIntro .gn-iline{width:0;height:1px;background:var(--rust);margin-top:24px}\n    #gnIntro.play .gn-iline{animation:gnLine .7s cubic-bezier(.16,1,.3,1) 1.05s forwards}\n    #gnIntro .gn-itag{margin-top:20px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:#8a857c;opacity:0}\n    #gnIntro.play .gn-itag{animation:gnFade .8s ease 1.2s forwards}\n    #gnIntro.out{clip-path:inset(0 0 100% 0);transition:clip-path .9s cubic-bezier(.76,0,.24,1)}\n    @keyframes gnRise{to{transform:translateY(0)}}\n    @keyframes gnLine{to{width:min(300px,62vw)}}\n    @keyframes gnFade{to{opacity:1}}\n  `;\n  document.head.appendChild(css);\n  if (REDUCE) document.documentElement.classList.add('gn-reduce');\n\n  function burstSmoke(container, count, ox, oy){\n    if(!container) return;\n    for(var i=0;i<count;i++){\n      var s=document.createElement('div'); s.className='gn-smoke';\n      var sz=6+Math.random()*10; s.style.width=sz+'px'; s.style.height=sz+'px';\n      s.style.left=ox+'px'; s.style.top=oy+'px'; s.style.opacity='.35';\n      container.appendChild(s);\n      (function(s){\n        var ang=Math.random()*Math.PI*2, sp=2+Math.random()*5, vx=Math.cos(ang)*sp, vy=Math.sin(ang)*sp, x=ox, y=oy, op=.35;\n        (function step(){ x+=vx; y+=vy; vx*=.92; vy*=.92; op-=.014; s.style.left=x+'px'; s.style.top=y+'px'; s.style.opacity=Math.max(0,op); if(op>0) requestAnimationFrame(step); else s.remove(); })();\n      })(s);\n    }\n  }\n\n  function buildMark(){\n    var brand=document.querySelector('.nav .brand'); if(!brand || brand.querySelector('.gn-ninja')) return;\n    var anchor=brand.querySelector('a')||brand.querySelector('span');\n    var btn=document.createElement('button');\n    btn.className='gn-ninja'; btn.setAttribute('data-hot',''); btn.setAttribute('aria-label','Choose element theme');\n    btn.innerHTML=ninjaHTML();\n    if(anchor && anchor.nextSibling) brand.insertBefore(btn, anchor.nextSibling); else brand.appendChild(btn);\n    btn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); togglePop(); });\n  }\n\n  var pop=null;\n  function buildPop(){\n    pop=document.createElement('div'); pop.className='gn-pop';\n    var html='<div class=\"gn-h\">Choose your element<\u002Fdiv>';\n    for(var i=0;i<THEMES.length;i++){ var t=THEMES[i];\n      html+='<button class=\"gn-opt\" data-hot data-k=\"'+t.k+'\"><span class=\"gn-chip\" style=\"background:'+t.rust+'\"><i><\u002Fi><i><\u002Fi><\u002Fspan><span class=\"gn-nm\">'+t.nm+'<small>'+t.el+'<\u002Fsmall><\u002Fspan><\u002Fbutton>';\n    }\n    pop.innerHTML=html; document.body.appendChild(pop);\n    pop.addEventListener('click', function(e){ var o=e.target.closest('.gn-opt'); if(!o) return; apply(o.getAttribute('data-k'), true); setTimeout(closePop,180); });\n    document.addEventListener('click', function(e){ if(pop.classList.contains('open') && !e.target.closest('.gn-pop') && !e.target.closest('.gn-ninja')) closePop(); });\n    apply(saved,false);\n  }\n  function togglePop(){ pop.classList.contains('open')?closePop():pop.classList.add('open'); }\n  function closePop(){ pop.classList.remove('open'); }\n\n  function intro(){\n    var played=false; try{ played=sessionStorage.getItem('grumb_ninja_intro')==='1'; }catch(e){}\n    if(played || REDUCE) return;\n    var ov=document.createElement('div'); ov.id='gnIntro';\n    ov.innerHTML='<div class=\"gn-bigninja\">'+ninjaHTML()+'<\u002Fdiv>'+\n      '<div class=\"gn-iword\"><span>g<\u002Fspan><span>r<\u002Fspan><span>u<\u002Fspan><span>m<\u002Fspan><span>b<\u002Fspan><b>.<\u002Fb><\u002Fdiv>'+\n      '<div class=\"gn-iline\"><\u002Fdiv><div class=\"gn-itag\">the art of staying unseen<\u002Fdiv>';\n    document.body.appendChild(ov); document.body.style.overflow='hidden';\n    requestAnimationFrame(function(){ requestAnimationFrame(function(){ ov.classList.add('play'); burstSmoke(ov.querySelector('.gn-bigninja'), 24, 75, 70); }); });\n    setTimeout(function(){ ov.classList.add('out'); setTimeout(function(){ ov.remove(); document.body.style.overflow=''; }, 920); }, 2450);\n    try{ sessionStorage.setItem('grumb_ninja_intro','1'); }catch(e){}\n  }\n\n  window.grumbBurst = burstSmoke;\n  function init(){ buildMark(); buildPop(); intro(); }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();\n})();<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
